<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaTV - Loja</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body{
  background:#050510;
  color:white;
  overflow-x:hidden;
}

/* ===== BACKGROUND ANIMADO ===== */

body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background: radial-gradient(circle at 30% 40%, #00f7ff33, transparent 40%),
              radial-gradient(circle at 70% 60%, #ff00ff33, transparent 40%);
  animation: rotateBg 20s linear infinite;
  z-index:-1;
}

@keyframes rotateBg{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

/* ===== HEADER ===== */

header{
  text-align:center;
  padding:60px 20px;
}

header h1{
  font-size:48px;
  background:linear-gradient(90deg,#00f7ff,#ff00ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 20px #00f7ff;
}

/* ===== CARDS ===== */

.container{
  display:flex;
  justify-content:center;
  gap:50px;
  padding:80px 20px;
  flex-wrap:wrap;
}

.card{
  width:320px;
  height:200px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.5s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  width:150%;
  height:150%;
  background:linear-gradient(45deg,#00f7ff,#ff00ff,#00f7ff);
  animation:glow 4s linear infinite;
  z-index:-1;
}

@keyframes glow{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

.card:hover{
  transform:translateY(-15px) scale(1.05);
  box-shadow:0 0 40px #00f7ff;
}

.card h2{
  font-size:24px;
  margin-bottom:10px;
}

.card p{
  opacity:0.7;
}

/* ===== FOOTER ESTILO PRINCIPAL ===== */

footer{
  margin-top:100px;
  padding:40px;
  text-align:center;
  background:linear-gradient(90deg,#00f7ff11,#ff00ff11);
  border-top:1px solid #00f7ff33;
  backdrop-filter:blur(10px);
}

footer p{
  opacity:0.6;
}

</style>
</head>
<body>

<header>
  <h1>AlphaTV - Stream</h1>
</header>

<div class="container">

  <div class="card" onclick="window.location.href='/apps'">
    <h2>📲 Aplicativos</h2>
    <p>Acessar todos os Apps</p>
  </div>

  <div class="card" onclick="window.location.href='/afiliado'">
    <h2>💰 Painel Afiliado</h2>
    <p>Acessar área exclusiva</p>
  </div>

</div>

<footer>
  <p>© 2026 AlphaTV - Todos os direitos reservados</p>
</footer>

<script>

// EFEITO DE MOUSE 3D
document.querySelectorAll(".card").forEach(card=>{
  card.addEventListener("mousemove", (e)=>{
    const x = e.offsetX;
    const y = e.offsetY;
    const rotateX = (y - 100) / 10;
    const rotateY = (x - 160) / 10;
    card.style.transform = `rotateX(${ -rotateX }deg) rotateY(${ rotateY }deg) scale(1.05)`;
  });

  card.addEventListener("mouseleave", ()=>{
    card.style.transform = "rotateX(0) rotateY(0) scale(1)";
  });
});

</script>

</body>
</html>
