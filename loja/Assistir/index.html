<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaTV - Carregando...</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
opacity:1;
transition:opacity 0.8s ease;
}

video{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-1;
}

.loading-bar{
position:absolute;
bottom:50px;
width:300px;
height:6px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.loading-progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#00f7ff,#ff00ff);
animation:load 5s linear forwards;
}

@keyframes load{
from{width:0%;}
to{width:100%;}
}
</style>
</head>
<body>

<video id="introVideo" autoplay playsinline>
<source src="intro.mp4" type="video/mp4">
</video>

<div class="loading-bar">
<div class="loading-progress"></div>
</div>

<script>

const video = document.getElementById("introVideo");

// Tenta tocar com som
video.play().catch(() => {
    // Se bloquear, tenta novamente após interação
    document.body.addEventListener("click", () => {
        video.play();
    });
});

// Após 5 segundos
setTimeout(() => {

document.body.style.opacity = "0";

setTimeout(() => {
window.location.href = "http://playerbr.webplayer.one/";
}, 800);

}, 5000);

</script>

</body>
</html>
