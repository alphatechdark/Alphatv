<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron', sans-serif;
}

body{
  font-family:'Poppins',sans-serif;
  background:#07070f;
  color:white;
  overflow-x:hidden;
}

/* ===== FUNDO ANIMADO ===== */

body::before{
content:"";
position:fixed;
width:200%;
height:200%;
background:
radial-gradient(circle at 20% 30%, #00f7ff33, transparent 40%),
radial-gradient(circle at 80% 70%, #ff00ff33, transparent 40%);
animation:spin 25s linear infinite;
z-index:-2;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* ===== PARTÍCULAS ===== */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* ===== TITULO GLITCH ===== */

header{
text-align:center;
padding:60px 20px;
}

.glitch{
font-size:48px;
position:relative;
color:#00f7ff;
text-shadow:0 0 20px #00f7ff;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
width:100%;
}

.glitch::before{
color:#ff00ff;
z-index:-1;
animation:glitch1 2s infinite linear alternate-reverse;
}

.glitch::after{
color:#00f7ff;
z-index:-2;
animation:glitch2 2s infinite linear alternate-reverse;
}

@keyframes glitch1{
0%{transform:translate(2px,-2px);}
100%{transform:translate(-2px,2px);}
}

@keyframes glitch2{
0%{transform:translate(-2px,2px);}
100%{transform:translate(2px,-2px);}
}

/* ===== CARDS ===== */

.container{
display:flex;
justify-content:center;
gap:60px;
padding:80px;
flex-wrap:wrap;
}

.card{
width:320px;
height:200px;
background:#111;
border-radius:20px;
position:relative;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:0.5s;
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
inset:0;
padding:2px;
background:linear-gradient(45deg,#00f7ff,#ff00ff,#00f7ff);
background-size:400%;
animation:borderRGB 6s linear infinite;
-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
border-radius:20px;
}

@keyframes borderRGB{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

.card:hover{
transform:translateY(-20px) scale(1.07) rotateX(10deg);
box-shadow:0 0 40px #00f7ff;
}

.card h2{
font-size:22px;
margin-bottom:10px;
}

.card p{
opacity:0.7;
}

/* ===== RODAPÉ ENERGIA ===== */

footer{
margin-top:100px;
padding:40px;
text-align:center;
border-top:1px solid #00f7ff55;
background:linear-gradient(90deg,#00f7ff11,#ff00ff11);
box-shadow:0 -10px 40px #00f7ff22;
}

footer p{
opacity:0.6;
}

img{
  max-width:100%;
  height:auto;
}

@media (max-width:768px){

    .hero {
        padding: 60px 15px 30px;
    }

    .logo {
        width: 90%;
        max-width: 280px;
        padding: 15px;
        margin: 0 auto;
    }

    .hero h1 {
        font-size: 26px;
        line-height: 1.3;
    }

}

.grid{
    grid-template-columns:1fr;
}

.whatsapp-float {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    z-index: 999;

    background: linear-gradient(135deg, #6a00ff, #b300ff);

    box-shadow:
        0 0 15px #8a2eff,
        0 0 35px #b300ff,
        0 0 70px #d000ff,
        0 0 120px rgba(208,0,255,0.8);

    animation: neonPulse 1.8s infinite alternate;
    transition: 0.3s ease;
}

.whatsapp-float svg {
    width: 32px;
    height: 32px;
}

.whatsapp-float:hover {
    transform: scale(1.15);
}

@keyframes neonPulse {
    from {
        box-shadow:
            0 0 15px #8a2eff,
            0 0 40px #b300ff;
    }
    to {
        box-shadow:
            0 0 40px #d000ff,
            0 0 90px #ff00ff;
    }
}

@media (max-width:768px){
  .whatsapp-float{
    width:60px;
    height:60px;
    bottom:20px;
    right:20px;
  }
}

<script>

/* ===== PARTÍCULAS ===== */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle{
constructor(){
this.x = Math.random()*canvas.width;
this.y = Math.random()*canvas.height;
this.size = Math.random()*2;
this.speedX = Math.random()*1-0.5;
this.speedY = Math.random()*1-0.5;
}
update(){
this.x += this.speedX;
this.y += this.speedY;
}
draw(){
ctx.fillStyle="#00f7ff";
ctx.beginPath();
ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
ctx.fill();
}
}

function init(){
for(let i=0;i<120;i++){
particlesArray.push(new Particle());
}
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particlesArray.forEach(p=>{
p.update();
p.draw();
});
requestAnimationFrame(animate);
}

init();
animate();



</script>
