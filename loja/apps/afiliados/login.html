<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Afiliado - AlphaTV</title>
<link rel="icon" type="image/png" href="img/favicon.png">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#07070f;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login-box{
    background:rgba(20,0,40,0.9);
    padding:50px 40px;
    border-radius:25px;
    backdrop-filter:blur(20px);
    text-align:center;
    width:320px;
    box-shadow:
        0 0 20px #6a00ff,
        0 0 60px #ff00c8;
    animation: float 4s ease-in-out infinite;
}

.login-box h2{
    margin-bottom:30px;
    background:linear-gradient(90deg,#00f2ff,#ff00c8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.login-box input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
}

.login-box button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#6a00ff,#ff00c8);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #ff00c8;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

.error{
    color:#ff4d4d;
    margin-top:10px;
    display:none;
}
</style>
</head>
<body>

<div class="login-box">
    <h2>Painel do Afiliado</h2>
    <input type="text" id="user" placeholder="Usuário">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <div class="error" id="error">Usuário ou senha inválidos</div>
</div>

<script>
function login(){

    const usuario = document.getElementById("user").value.trim();
    const senha = document.getElementById("pass").value.trim();
    const erro = document.getElementById("error");

    // 👇 USUÁRIOS REAIS (SEM BASE64 PARA TESTAR)
    const usuarios = [
        {
            user: "Deva.alphatv",
            pass: "Sony193232"
        },
        {
            user: "joao.alphatv",
            pass: "Alpha2025"
        }
    ];

    const autorizado = usuarios.find(u => 
        u.user === usuario && u.pass === senha
    );

    if(autorizado){
        localStorage.setItem("alphaAuth", "logado");
        localStorage.setItem("alphaUser", usuario);
        window.location.href = "index.html";
    } else {
        erro.style.display = "block";
    }
}
</script>

</body>
</html>
